<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CCLメンバー情報 検索サイト</title>
  <meta
    name="description"
    content="CCL Community メンバー専用の検索サイト。メンバーIDまたはDiscord表示名で、現在のランクや獲得ポイントを確認できます。"
  />
  <style>
    :root {
      --bg-1: #020617;
      --bg-2: #071128;
      --bg-3: #0b1733;
      --panel: rgba(10, 19, 42, 0.72);
      --panel-strong: rgba(9, 18, 39, 0.92);
      --line: rgba(122, 162, 255, 0.22);
      --line-strong: rgba(122, 162, 255, 0.42);
      --text-main: #f8fbff;
      --text-sub: #9fb0d1;
      --text-soft: #6f82a8;
      --accent: #5ea2ff;
      --accent-2: #7dd3fc;
      --accent-deep: #285dff;
      --success: #7cf7c4;
      --danger: #ff8b8b;
      --shadow: 0 25px 60px rgba(0, 0, 0, 0.45);
      --glow: 0 0 0 1px rgba(122, 162, 255, 0.15),
              0 0 24px rgba(94, 162, 255, 0.12),
              0 12px 36px rgba(4, 10, 24, 0.55);
      --radius-xl: 28px;
      --radius-lg: 22px;
      --radius-md: 16px;
      --radius-sm: 12px;
      --transition: 0.28s ease;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family:
        "Inter",
        "Hiragino Sans",
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        "Meiryo",
        sans-serif;
      color: var(--text-main);
      background:
        radial-gradient(circle at 20% 15%, rgba(68, 126, 255, 0.18), transparent 26%),
        radial-gradient(circle at 80% 0%, rgba(88, 155, 255, 0.18), transparent 24%),
        radial-gradient(circle at 50% 100%, rgba(41, 89, 184, 0.22), transparent 32%),
        linear-gradient(180deg, var(--bg-3) 0%, var(--bg-2) 30%, var(--bg-1) 100%);
      overflow-x: hidden;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: auto;
      pointer-events: none;
      z-index: 0;
      filter: blur(10px);
    }

    body::before {
      width: 42vw;
      height: 42vw;
      top: -12vw;
      left: -10vw;
      background: radial-gradient(circle, rgba(70, 130, 255, 0.18), transparent 68%);
      animation: floatGlow 14s ease-in-out infinite;
    }

    body::after {
      width: 36vw;
      height: 36vw;
      right: -8vw;
      bottom: -12vw;
      background: radial-gradient(circle, rgba(78, 205, 255, 0.12), transparent 70%);
      animation: floatGlow 16s ease-in-out infinite reverse;
    }

    @keyframes floatGlow {
      0%, 100% {
        transform: translate3d(0, 0, 0) scale(1);
      }
      50% {
        transform: translate3d(0, 18px, 0) scale(1.04);
      }
    }

    .shell {
      position: relative;
      z-index: 1;
      width: min(100%, 880px);
      margin: 0 auto;
      padding: 28px 18px 56px;
    }

    .hero {
      position: relative;
      overflow: hidden;
      border: 1px solid var(--line);
      background:
        linear-gradient(180deg, rgba(15, 31, 69, 0.82), rgba(7, 15, 35, 0.92)),
        linear-gradient(135deg, rgba(94, 162, 255, 0.06), rgba(125, 211, 252, 0.03));
      border-radius: 30px;
      padding: 28px 22px 24px;
      box-shadow: var(--shadow);
      isolation: isolate;
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(120deg, transparent 0%, rgba(255,255,255,0.04) 18%, transparent 34%),
        radial-gradient(circle at 100% 0%, rgba(94, 162, 255, 0.14), transparent 28%);
      opacity: 0.95;
      pointer-events: none;
    }

    .hero::after {
      content: "";
      position: absolute;
      top: -40%;
      right: -8%;
      width: 220px;
      height: 220px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(94, 162, 255, 0.18), transparent 68%);
      pointer-events: none;
    }

    .eyebrow {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      padding: 8px 14px;
      border: 1px solid rgba(122, 162, 255, 0.24);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.03);
      color: #d6e7ff;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      backdrop-filter: blur(10px);
    }

    .eyebrow-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: linear-gradient(180deg, #8fd7ff, #4f90ff);
      box-shadow: 0 0 12px rgba(94, 162, 255, 0.8);
      flex-shrink: 0;
    }

    .hero h1 {
      position: relative;
      margin: 0;
      font-size: clamp(28px, 6vw, 48px);
      line-height: 1.08;
      font-weight: 800;
      letter-spacing: -0.04em;
      text-wrap: balance;
    }

    .hero p {
      position: relative;
      margin: 14px 0 0;
      max-width: 620px;
      color: var(--text-sub);
      font-size: clamp(14px, 2.8vw, 16px);
      line-height: 1.8;
    }

    .search-panel {
      margin-top: 20px;
      position: relative;
      border: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(10, 20, 43, 0.78), rgba(7, 14, 32, 0.88));
      border-radius: 26px;
      padding: 18px;
      box-shadow: var(--glow);
      backdrop-filter: blur(14px);
    }

    .search-label {
      display: block;
      margin-bottom: 12px;
      color: #d4e5ff;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.08em;
    }

    .search-row {
      display: flex;
      gap: 12px;
      align-items: stretch;
      flex-direction: column;
    }

    .input-wrap {
      position: relative;
      flex: 1;
    }

    .input-wrap::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 18px;
      padding: 1px;
      background: linear-gradient(135deg, rgba(125, 211, 252, 0.22), rgba(94, 162, 255, 0.1));
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
      opacity: 0.95;
    }

    .search-input {
      width: 100%;
      min-height: 58px;
      padding: 0 18px 0 48px;
      border: 1px solid rgba(255,255,255,0.04);
      border-radius: 18px;
      outline: none;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.02)),
        rgba(4, 10, 24, 0.9);
      color: var(--text-main);
      font-size: 16px;
      font-weight: 600;
      transition: border-color var(--transition), box-shadow var(--transition), transform var(--transition);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.04);
    }

    .search-input::placeholder {
      color: #7f93ba;
      font-weight: 500;
    }

    .search-input:focus {
      border-color: rgba(94, 162, 255, 0.32);
      box-shadow:
        0 0 0 4px rgba(94, 162, 255, 0.1),
        0 0 24px rgba(94, 162, 255, 0.12);
      transform: translateY(-1px);
    }

    .search-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      color: #9fc6ff;
      opacity: 0.92;
      pointer-events: none;
    }

    .search-button {
      position: relative;
      min-height: 58px;
      border: none;
      border-radius: 18px;
      padding: 0 22px;
      background:
        linear-gradient(180deg, rgba(102, 173, 255, 0.95), rgba(47, 102, 255, 0.96));
      color: white;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.04em;
      cursor: pointer;
      transition: transform var(--transition), box-shadow var(--transition), filter var(--transition);
      box-shadow:
        0 12px 24px rgba(16, 62, 166, 0.32),
        inset 0 1px 0 rgba(255,255,255,0.24);
      overflow: hidden;
      isolation: isolate;
    }

    .search-button::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(120deg, transparent 0%, rgba(255,255,255,0.18) 22%, transparent 46%);
      transform: translateX(-110%);
      transition: transform 0.7s ease;
      z-index: -1;
    }

    .search-button:hover {
      transform: translateY(-2px);
      box-shadow:
        0 18px 30px rgba(16, 62, 166, 0.38),
        inset 0 1px 0 rgba(255,255,255,0.25);
      filter: saturate(1.05);
    }

    .search-button:hover::before {
      transform: translateX(120%);
    }

    .search-button:active {
      transform: translateY(0);
    }

    .search-button:disabled {
      cursor: not-allowed;
      opacity: 0.72;
      transform: none;
      box-shadow:
        0 8px 18px rgba(16, 62, 166, 0.18),
        inset 0 1px 0 rgba(255,255,255,0.15);
    }

    .hint {
      margin-top: 12px;
      color: var(--text-soft);
      font-size: 12px;
      line-height: 1.7;
    }

    .status {
      display: none;
      align-items: center;
      gap: 10px;
      margin-top: 16px;
      padding: 14px 16px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.06);
      background: rgba(255,255,255,0.03);
      color: var(--text-sub);
      font-size: 14px;
      font-weight: 600;
    }

    .status.show {
      display: flex;
    }

    .status.loading {
      border-color: rgba(94, 162, 255, 0.18);
      background: rgba(46, 99, 255, 0.07);
      color: #d7e8ff;
    }

    .status.error {
      border-color: rgba(255, 139, 139, 0.18);
      background: rgba(255, 93, 93, 0.08);
      color: #ffd1d1;
    }

    .status.success {
      border-color: rgba(124, 247, 196, 0.18);
      background: rgba(74, 205, 145, 0.08);
      color: #d6ffef;
    }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.18);
      border-top-color: #cde7ff;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
      flex-shrink: 0;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .result-wrap {
      margin-top: 22px;
      min-height: 120px;
    }

    .member-card {
      position: relative;
      overflow: hidden;
      border-radius: 30px;
      border: 1px solid rgba(122, 162, 255, 0.18);
      background:
        linear-gradient(180deg, rgba(15, 28, 60, 0.82), rgba(7, 15, 35, 0.95)),
        linear-gradient(145deg, rgba(94, 162, 255, 0.06), rgba(125, 211, 252, 0.02));
      box-shadow:
        0 24px 54px rgba(0, 0, 0, 0.42),
        0 0 0 1px rgba(122, 162, 255, 0.08);
      backdrop-filter: blur(14px);
      padding: 22px 18px 18px;
      transform: translateY(10px);
      opacity: 0;
      animation: fadeUp 0.45s ease forwards;
    }

    @keyframes fadeUp {
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .member-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 100% 0%, rgba(94, 162, 255, 0.16), transparent 28%),
        linear-gradient(120deg, transparent 0%, rgba(255,255,255,0.035) 18%, transparent 34%);
      pointer-events: none;
    }

    .card-topline {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }

    .card-label {
      color: #d5e7ff;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      opacity: 0.88;
    }

    .card-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      color: #dcecff;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }

    .card-grid {
      display: grid;
      gap: 12px;
      grid-template-columns: 1fr;
      margin-bottom: 18px;
    }

    .info-box {
      border-radius: 20px;
      padding: 16px 16px 14px;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.015)),
        rgba(4, 10, 24, 0.4);
      border: 1px solid rgba(122, 162, 255, 0.12);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.03);
    }

    .info-box .mini {
      display: block;
      margin-bottom: 8px;
      color: var(--text-soft);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .info-box .value {
      color: var(--text-main);
      font-size: 17px;
      font-weight: 700;
      line-height: 1.4;
      word-break: break-word;
    }

    .spotlight-wrap {
      display: grid;
      gap: 12px;
      grid-template-columns: 1fr;
      margin-bottom: 18px;
    }

    .spotlight {
      position: relative;
      overflow: hidden;
      border-radius: 24px;
      padding: 18px 16px 16px;
      min-height: 118px;
      background:
        linear-gradient(180deg, rgba(13, 31, 72, 0.92), rgba(6, 14, 34, 0.94));
      border: 1px solid rgba(122, 162, 255, 0.2);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.04),
        0 10px 28px rgba(0,0,0,0.26);
    }

    .spotlight::after {
      content: "";
      position: absolute;
      width: 140px;
      height: 140px;
      border-radius: 50%;
      right: -40px;
      top: -54px;
      background: radial-gradient(circle, rgba(94, 162, 255, 0.18), transparent 70%);
      pointer-events: none;
    }

    .spotlight-title {
      color: #bfd7ff;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      margin-bottom: 10px;
      opacity: 0.94;
    }

    .spotlight-main {
      position: relative;
      display: flex;
      align-items: flex-end;
      gap: 10px;
      flex-wrap: wrap;
      z-index: 1;
    }

    .spotlight-value {
      font-size: clamp(28px, 7vw, 38px);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.04em;
      color: #ffffff;
      text-shadow: 0 0 24px rgba(94, 162, 255, 0.14);
    }

    .spotlight-sub {
      font-size: 14px;
      font-weight: 700;
      color: #dceaff;
      opacity: 0.92;
      padding-bottom: 3px;
    }

    .spotlight-rank {
      background:
        linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02)),
        rgba(4, 10, 24, 0.24);
    }

    .rank-chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 74px;
      min-height: 36px;
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.02em;
      border: 2px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.06);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.08);
      text-shadow: none;
    }

    .rank-c {
      color: #000000;
      background:
        linear-gradient(180deg, #d7ff8a 0%, #9be15d 52%, #76c442 100%);
      border-color: #5ba833;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.35),
        0 0 20px rgba(129, 214, 58, 0.22);
    }

    .rank-b {
      color: #000000;
      background:
        linear-gradient(180deg, #ffd08c 0%, #ffad42 52%, #f08400 100%);
      border-color: #d16e00;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.34),
        0 0 20px rgba(255, 153, 0, 0.22);
    }

    .rank-a {
      color: #000000;
      background:
        linear-gradient(180deg, #fff6a6 0%, #ffe45c 50%, #ffcd00 100%);
      border-color: #d4b000;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.42),
        0 0 22px rgba(255, 214, 0, 0.22);
    }

    .rank-s {
      color: #f7d76a;
      background:
        linear-gradient(135deg, #caa8ff 0%, #8e44ff 22%, #5f23d4 44%, #c8a9ff 58%, #6d28d9 76%, #4b168f 100%);
      border-color: #d4af37;
      text-shadow: 0 1px 3px rgba(0,0,0,0.45);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.35),
        0 0 24px rgba(145, 92, 255, 0.38);
    }

    .rank-ss {
      color: #f7d76a;
      background:
        linear-gradient(135deg, #ffb3b3 0%, #ff3d3d 20%, #b31212 45%, #ff9a9a 58%, #d11f1f 78%, #5d0b0b 100%);
      border-color: #d4af37;
      text-shadow: 0 1px 3px rgba(0,0,0,0.45);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.3),
        0 0 26px rgba(255, 59, 59, 0.42);
    }

    .rank-sss {
      color: #f7d76a;
      background:
        linear-gradient(135deg, #4b4b4b 0%, #0f0f0f 20%, #000000 45%, #595959 58%, #111111 76%, #000000 100%);
      border-color: #d4af37;
      text-shadow: 0 1px 3px rgba(0,0,0,0.6);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.18),
        0 0 28px rgba(255, 215, 0, 0.2);
    }

    .progress-section {
      display: grid;
      gap: 12px;
      grid-template-columns: 1fr;
    }

    .progress-card {
      border-radius: 20px;
      padding: 16px 16px 14px;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.015)),
        rgba(4, 10, 24, 0.36);
      border: 1px solid rgba(122, 162, 255, 0.12);
    }



    .ranking-dual-section {
      display: grid;
      gap: 12px;
      grid-template-columns: 1fr;
      margin-top: 12px;
    }

    .ranking-card-label-total,
    .ranking-card-label-weekly {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .progress-card.ranking-total-card {
      border-color: rgba(255, 220, 120, 0.42);
      background:
        linear-gradient(180deg, rgba(36, 28, 8, 0.94), rgba(8, 10, 20, 0.96)),
        radial-gradient(circle at 100% 0%, rgba(255, 220, 120, 0.16), transparent 34%);
    }

    .progress-card.ranking-weekly-card {
      border-color: rgba(94, 211, 255, 0.36);
      background:
        linear-gradient(180deg, rgba(9, 31, 54, 0.94), rgba(7, 12, 26, 0.96)),
        radial-gradient(circle at 100% 0%, rgba(94, 211, 255, 0.16), transparent 34%);
    }

    .progress-card.top10-card.ranking-total-card,
    .progress-card.top10-card.ranking-weekly-card {
      position: relative;
      overflow: hidden;
    }

    .progress-card.top10-card.ranking-total-card::after,
    .progress-card.top10-card.ranking-weekly-card::after {
      content: "";
      position: absolute;
      inset: -2px;
      pointer-events: none;
      background:
        linear-gradient(120deg, transparent 0%, rgba(255,255,255,0.12) 15%, transparent 30%, transparent 100%);
      transform: translateX(-130%);
      animation: rankShine 4.2s ease-in-out infinite;
    }

    @keyframes rankShine {
      0%, 55% { transform: translateX(-130%); opacity: 0; }
      66% { opacity: 1; }
      100% { transform: translateX(130%); opacity: 0; }
    }

    .ranking-title-mark {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 900;
      color: #111827;
      background: linear-gradient(180deg, #fff6c7, #d9a927);
      box-shadow: 0 0 16px rgba(255, 218, 92, 0.26);
    }

    .ranking-weekly-card .ranking-title-mark {
      color: #03111f;
      background: linear-gradient(180deg, #dff8ff, #67d8ff);
      box-shadow: 0 0 16px rgba(103, 216, 255, 0.24);
    }

    .progress-fill.is-empty {
      background: linear-gradient(90deg, #020617 0%, #071128 100%);
      box-shadow: none;
      opacity: 1;
    }

    .progress-card.top10-card {
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255, 215, 122, 0.36);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.08),
        0 16px 34px rgba(0,0,0,0.34),
        0 0 30px rgba(255, 214, 102, 0.12);
      background:
        linear-gradient(180deg, rgba(30, 24, 10, 0.92), rgba(10, 9, 19, 0.94)),
        linear-gradient(135deg, rgba(255, 220, 120, 0.16), rgba(255,255,255,0.03) 38%, rgba(255, 204, 86, 0.08));
    }

    .progress-card.top10-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(120deg, transparent 0%, rgba(255,255,255,0.08) 18%, transparent 32%),
        radial-gradient(circle at 100% 0%, rgba(255, 215, 120, 0.18), transparent 32%);
      pointer-events: none;
    }

    .progress-card.top10-1 {
      border-color: rgba(255, 224, 124, 0.75);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.12),
        0 18px 38px rgba(0,0,0,0.42),
        0 0 40px rgba(255, 215, 0, 0.22);
      background:
        linear-gradient(180deg, rgba(54, 37, 0, 0.94), rgba(17, 13, 6, 0.96)),
        linear-gradient(135deg, rgba(255, 241, 166, 0.22), rgba(255, 214, 10, 0.12) 42%, rgba(255,255,255,0.04) 66%, rgba(181, 131, 0, 0.16));
    }

    .progress-card.top10-2 {
      border-color: rgba(225, 232, 245, 0.74);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.12),
        0 18px 38px rgba(0,0,0,0.4),
        0 0 38px rgba(205, 220, 245, 0.18);
      background:
        linear-gradient(180deg, rgba(33, 40, 53, 0.95), rgba(13, 16, 24, 0.96)),
        linear-gradient(135deg, rgba(244, 247, 252, 0.16), rgba(186, 198, 214, 0.12) 46%, rgba(255,255,255,0.04) 68%, rgba(122, 136, 154, 0.14));
    }

    .progress-card.top10-3 {
      border-color: rgba(234, 171, 112, 0.72);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.12),
        0 18px 38px rgba(0,0,0,0.4),
        0 0 38px rgba(210, 128, 54, 0.18);
      background:
        linear-gradient(180deg, rgba(58, 28, 7, 0.95), rgba(18, 10, 7, 0.96)),
        linear-gradient(135deg, rgba(255, 202, 154, 0.18), rgba(191, 102, 37, 0.14) 46%, rgba(255,255,255,0.03) 68%, rgba(111, 55, 24, 0.16));
    }

    .progress-card.top10-elite {
      border-color: rgba(255, 220, 138, 0.44);

        0 16px 34px rgba(0,0,0,0.36),
        0 0 30px rgba(255, 215, 130, 0.12);
      background:
        linear-gradient(180deg, rgba(36, 28, 13, 0.94), rgba(11, 10, 19, 0.95)),
        linear-gradient(135deg, rgba(255, 222, 140, 0.14), rgba(255,255,255,0.03) 38%, rgba(230, 178, 72, 0.1));

    .progress-title {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: baseline;
      margin-bottom: 10px;
    }

    .progress-title span:first-child {

    .progress-title span:last-child {

    .progress-card.top10-card .progress-title span:first-child {
      color: #fff0c0;

    .progress-card.top10-card .progress-note {

    }

    .progress-note {
      color: var(--text-sub);

    .top10-rank-display {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 16px;
      border-radius: 999px;
      min-height: 46px;
      font-weight: 900;
      line-height: 1;
      letter-spacing: 0.04em;
      border: 1px solid rgba(255,255,255,0.14);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.18),

      text-transform: uppercase;
      font-family:
        "Georgia",
        "Times New Roman",
        "Hiragino Mincho ProN",
        "Yu Mincho",
        serif;
    }

    .top10-rank-1 {
      color: #fff8dc;
      background:
        linear-gradient(135deg, #fff8c2 0%, #ffd84e 24%, #b57c00 48%, #fff0a4 66%, #e1b100 82%, #6b4a00 100%);
      border-color: rgba(255, 236, 152, 0.9);
      text-shadow:
        0 1px 0 rgba(255,255,255,0.45),
        0 0 18px rgba(255, 225, 120, 0.38),
        0 2px 8px rgba(67, 42, 0, 0.68);
      font-size: clamp(28px, 6vw, 42px);
      box-shadow:
        inset 0 2px 0 rgba(255,255,255,0.26),
        0 0 30px rgba(255, 215, 0, 0.28),
        0 14px 28px rgba(0,0,0,0.34);
    }

    .top10-rank-2 {
      color: #fcfdff;
      background:
        linear-gradient(135deg, #ffffff 0%, #e7edf5 24%, #9da8b8 48%, #ffffff 68%, #c9d0db 82%, #6e7888 100%);
      border-color: rgba(237, 241, 248, 0.9);
      text-shadow:
        0 1px 0 rgba(255,255,255,0.42),
        0 0 16px rgba(236, 242, 255, 0.32),
        0 2px 8px rgba(31, 39, 52, 0.66);
      font-size: clamp(28px, 6vw, 42px);
      box-shadow:
        inset 0 2px 0 rgba(255,255,255,0.24),
        0 0 28px rgba(220, 230, 245, 0.24),
        0 14px 28px rgba(0,0,0,0.34);
    }

    .top10-rank-3 {
      color: #fff4ea;
      background:
        linear-gradient(135deg, #ffd9bf 0%, #c97b3d 24%, #7d3f17 48%, #ffcaa5 68%, #b5622b 82%, #5a280f 100%);
      border-color: rgba(255, 201, 158, 0.88);
      text-shadow:
        0 1px 0 rgba(255,255,255,0.3),
        0 0 16px rgba(255, 191, 143, 0.22),
        0 2px 8px rgba(56, 24, 8, 0.68);
      font-size: clamp(28px, 6vw, 42px);
      box-shadow:
        inset 0 2px 0 rgba(255,255,255,0.2),
        0 0 26px rgba(199, 123, 61, 0.22),
        0 14px 28px rgba(0,0,0,0.34);
    }

    .top10-rank-elite {
      color: #fff4d0;
      background:
        linear-gradient(135deg, #fff2bc 0%, #ffcf63 18%, #8a5d10 38%, #fff2bc 58%, #d39a2f 76%, #68460f 100%);
      border-color: rgba(255, 224, 150, 0.72);
      text-shadow:
        0 1px 0 rgba(255,255,255,0.34),
        0 0 14px rgba(255, 213, 112, 0.26),
        0 2px 8px rgba(58, 35, 3, 0.64);
      font-size: clamp(24px, 5.4vw, 34px);
      box-shadow:
        inset 0 2px 0 rgba(255,255,255,0.16),
        0 0 22px rgba(255, 208, 98, 0.18),
        0 12px 24px rgba(0,0,0,0.32);
    }

    .top10-rank-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 10px;
      position: relative;
      z-index: 1;
    }

    .top10-crown {
      font-size: 24px;
      filter: drop-shadow(0 0 14px rgba(255, 217, 95, 0.42));
    }

    .progress-bar {
      width: 100%;
      height: 10px;
      border-radius: 999px;
      background: rgba(255,255,255,0.06);
      overflow: hidden;
      margin-top: 12px;
      box-shadow: inset 0 1px 1px rgba(0,0,0,0.28);
    }

    .progress-fill {
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #1ea94b 0%, #38d66b 55%, #79f2a0 100%);
      box-shadow: 0 0 18px rgba(56, 214, 107, 0.38);
      transform-origin: left center;
      min-width: 0;
      animation: progressPulse 2.8s ease-in-out infinite;
    }

    .top10-card .progress-bar {
      height: 12px;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02)),
        rgba(0,0,0,0.28);
      border: 1px solid rgba(255, 223, 138, 0.16);
      box-shadow:
        inset 0 1px 2px rgba(0,0,0,0.38),
        0 0 0 1px rgba(255,255,255,0.02);
    }

    .top10-card .progress-fill {
      background:
        linear-gradient(90deg, #6b4d00 0%, #d4a21d 18%, #fff2a6 42%, #ffd64d 62%, #b27900 100%);
      box-shadow:
        0 0 20px rgba(255, 214, 79, 0.28),
        0 0 32px rgba(255, 225, 130, 0.14);
    }

    @keyframes progressPulse {
      0%, 100% {
        opacity: 0.88;
      }
      50% {
        opacity: 1;
      }
    }

    .empty-card {
      display: grid;
      place-items: center;
      min-height: 180px;
      padding: 28px 20px;
      border-radius: 26px;
      border: 1px dashed rgba(122, 162, 255, 0.2);
      background:
        linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01)),
        rgba(4, 10, 24, 0.3);
      text-align: center;
      color: var(--text-sub);
    }

    .empty-card strong {
      display: block;
      margin-bottom: 8px;
      color: #e9f3ff;
      font-size: 17px;
      font-weight: 800;
    }

    .empty-card p {
      margin: 0;
      font-size: 14px;
      line-height: 1.8;
    }

    .footer-note {
      margin-top: 18px;
      text-align: center;
      color: var(--text-soft);
      font-size: 12px;
      line-height: 1.8;
    }

    @media (min-width: 640px) {
      .shell {
        padding: 42px 24px 72px;
      }

      .hero {
        padding: 34px 30px 28px;
      }

      .search-panel {
        padding: 22px;
      }

      .search-row {
        flex-direction: row;
      }

      .search-button {
        min-width: 140px;
      }

      .card-grid {
        grid-template-columns: repeat(3, 1fr);
      }

      .spotlight-wrap {
        grid-template-columns: repeat(2, 1fr);
      }

      .progress-section {
        grid-template-columns: repeat(2, 1fr);
      }

      .ranking-dual-section {
        grid-template-columns: repeat(2, 1fr);
      }

      .member-card {

      }
    }

    @media (min-width: 920px) {

        padding-top: 52px;
      }

      .hero {
        padding: 38px 36px 30px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation: none !important;
        transition: none !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="hero">
      <div class="eyebrow">
        <span class="eyebrow-dot"></span>
        <span>CCL Community</span>
      </div>

      <h1>CCLメンバー情報 検索サイト</h1>
      <p>
        member_id または Discord表示名を入力すると、
        現在のランク・獲得ポイント・次の目標までをすぐに確認できます。
      </p>

      <section class="search-panel" aria-label="検索エリア">
        <label class="search-label" for="searchInput">メンバーID または Discord表示名を入力</label>

        <div class="search-row">
          <div class="input-wrap">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M21 21L16.65 16.65M18 11C18 14.866 14.866 18 11 18C7.13401 18 4 14.866 4 11C4 7.13401 7.13401 4 11 4C14.866 4 18 7.13401 18 11Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <input
              id="searchInput"
              class="search-input"
              type="text"
              placeholder="例：M0000 / でぐち"
              autocomplete="off"
              enterkeyhint="search"
            />
          </div>

          <button id="searchButton" class="search-button" type="button">
            検索
          </button>
        </div>

        <div id="status" class="status" aria-live="polite"></div>

        <div class="hint">
          メンバーIDは完全一致、Discord表示名は部分一致でも検索できます。
        </div>
      </section>
    </section>

    <section class="result-wrap" id="result">
      <div class="empty-card">
        <div>
          <strong>検索待機中</strong>
          <p>
            上の検索バーにメンバーIDまたはDiscord表示名を入力して、
            メンバー情報を表示してください。
          </p>
        </div>
      </div>
    </section>

    <div class="footer-note">
      CCL Community Member Search
    </div>
  </main>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbzyzrBBw1NVUYwr0eFrycgOCt-FxTq5ogJ0KnkI42jyevki_atTAEwr6DcXZXWWeSmn0g/exec";

    const inputEl = document.getElementById("searchInput");
    const buttonEl = document.getElementById("searchButton");
    const resultEl = document.getElementById("result");
    const statusEl = document.getElementById("status");

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function normalizeRank(rank) {
      const text = String(rank ?? "").trim().toUpperCase();

      if (text.includes("SSS")) return "sss";
      if (text.includes("SS")) return "ss";
      if (text === "S" || text.includes("Sランク")) return "s";
      if (text.includes("A")) return "a";
      if (text.includes("B")) return "b";
      return "c";
    }

    function getRankClass(rank) {
      const normalized = normalizeRank(rank);
      if (normalized === "sss") return "rank-sss";
      if (normalized === "ss") return "rank-ss";
      if (normalized === "s") return "rank-s";
      if (normalized === "a") return "rank-a";
      if (normalized === "b") return "rank-b";
      return "rank-c";
    }

    function getRankMaxPoints(rank) {
      const normalized = normalizeRank(rank);
      if (normalized === "c") return 300;
      if (normalized === "b") return 800;
      if (normalized === "a") return 1500;
      if (normalized === "s") return 3000;
      if (normalized === "ss") return 5000;
      return 0;
    }

    function extractNumber(value) {
      const matches = String(value ?? "").match(/\d+/g);
      if (!matches) return 0;
      return parseInt(matches.join(""), 10) || 0;
    }

    function calculateRankProgress(rank, remainingText) {
      const normalized = normalizeRank(rank);

      if (normalized === "sss") {
        return 100;
      }

      const max = getRankMaxPoints(rank);
      const remaining = extractNumber(remainingText);

      if (max <= 0) return 0;

      const progress = ((max - remaining) / max) * 100;
      return Math.max(0, Math.min(100, progress));
    }

    function parseTop10Rank(value) {
      const text = String(value ?? "").trim();
      const match = text.match(/^(\d+)\s*位$/);
      if (!match) return null;

      const rank = parseInt(match[1], 10);
      if (rank >= 1 && rank <= 10) return rank;
      return null;
    }

    function isTop10Member(value) {
      return parseTop10Rank(value) !== null;
    }

    function getTop10CardClass(rankNumber) {
      if (rankNumber === 1) return "top10-card top10-1";
      if (rankNumber === 2) return "top10-card top10-2";
      if (rankNumber === 3) return "top10-card top10-3";
      return "top10-card top10-elite";
    }

    function getTop10DisplayClass(rankNumber) {
      if (rankNumber === 1) return "top10-rank-display top10-rank-1";
      if (rankNumber === 2) return "top10-rank-display top10-rank-2";
      if (rankNumber === 3) return "top10-rank-display top10-rank-3";
      return "top10-rank-display top10-rank-elite";
    }

    function calculateTop10Progress(toTop10Text, currentPoints = 0) {
  const rankNumber = parseTop10Rank(toTop10Text);

  // TOP10入りしている場合
  if (rankNumber !== null) {
    return 100;
  }

  const remaining = extractNumber(toTop10Text);
  const points = Number(currentPoints) || 0;

  // 本人の週間ptが0ならゲージは0%
  if (points <= 0) {
    return 0;
  }

  // 「あと○pt」も取れない場合は0%
  if (remaining <= 0) {
    return 0;
  }

  // 10位ライン = 本人pt + あと必要pt
  const borderPoint = points + remaining;

  if (borderPoint <= 0) {
    return 0;
  }

  const progress = (points / borderPoint) * 100;

  return Math.max(0, Math.min(100, progress));
}

    function formatPoint(value, suffix = "pt") {
      const text = String(value ?? "").trim();
      if (!text) return `0${suffix}`;
      return /pt$/i.test(text) ? text : `${text}${suffix}`;
    }

    function formatProgressText(value) {
      const text = String(value ?? "").trim();
      if (!text) return "あと0pt";
      if (text.includes("あと")) return text;
      if (/^\d+\s*位$/.test(text)) return text;
      if (/pt$/i.test(text)) return `あと${text}`;
      return `あと${text}pt`;
    }

    function showStatus(type, message) {
      if (!message) {
        statusEl.className = "status";
        statusEl.innerHTML = "";
        return;
      }

      const icon = type === "loading"
        ? `<span class="spinner" aria-hidden="true"></span>`
        : "";

      statusEl.className = `status show ${type}`;
      statusEl.innerHTML = `${icon}<span>${escapeHtml(message)}</span>`;
    }

    function renderEmpty(title, message) {
      resultEl.innerHTML = `
        <div class="empty-card">
          <div>
            <strong>${escapeHtml(title)}</strong>
            <p>${escapeHtml(message)}</p>
          </div>
        </div>
      `;
    }

    function getFirstValue(...values) {
      for (const value of values) {
        const text = String(value ?? "").trim();
        if (text) return value;
      }
      return "";
    }

    function buildRankingSection({ rawValue, points, title, type }) {
      const safeRawValue = String(rawValue ?? "").trim();
      const rankNumber = parseTop10Rank(safeRawValue);
      const progress = calculateTop10Progress(safeRawValue, points);
      const progressClass = progress <= 0 ? "progress-fill is-empty" : "progress-fill";
      const typeClass = type === "weekly" ? "ranking-weekly-card" : "ranking-total-card";
      const markText = type === "weekly" ? "W" : "T";
      const titleClass = type === "weekly" ? "ranking-card-label-weekly" : "ranking-card-label-total";

      if (rankNumber !== null) {
        const cardClass = getTop10CardClass(rankNumber);
        const displayClass = getTop10DisplayClass(rankNumber);
        const displayText = `${rankNumber}位`;
        const crown = rankNumber === 1 ? "👑" : rankNumber === 2 ? "◆" : rankNumber === 3 ? "◇" : "✦";

        return `
          <section class="progress-card ${cardClass} ${typeClass}">
            <div class="progress-title">
              <span class="${titleClass}"><span class="ranking-title-mark">${markText}</span>${escapeHtml(title)}</span>
              <span>TOP10入り達成</span>
            </div>

            <div class="top10-rank-wrap">
              <div class="top10-crown">${crown}</div>
              <div class="${displayClass}">${displayText}</div>
            </div>

            <div class="progress-note">
              ${escapeHtml(title)}のTOP10メンバーです。順位を守りながら、さらに上位を狙いましょう。
            </div>

            <div class="progress-bar" aria-hidden="true">
              <div class="${progressClass}" style="width: ${progress}%;"></div>
            </div>
          </section>
        `;
      }

      const top10Text = escapeHtml(formatProgressText(safeRawValue));

      return `
        <section class="progress-card ${typeClass}">
          <div class="progress-title">
            <span class="${titleClass}"><span class="ranking-title-mark">${markText}</span>${escapeHtml(title)}TOP10まで</span>
            <span>${top10Text}</span>
          </div>
          <div class="progress-note">
            現在の獲得ポイントを基準に、TOP10ラインまでの距離を表示しています。
          </div>
          <div class="progress-bar" aria-hidden="true">
            <div class="${progressClass}" style="width: ${progress}%;"></div>
          </div>
        </section>
      `;
    }

    function renderMemberCard(data) {
      const memberId = escapeHtml(data.member_id);
      const name = escapeHtml(data.discord_name);
      const plan = escapeHtml(data.plan);
      const rank = escapeHtml(data.rank);
      const points = escapeHtml(formatPoint(data.points, "pt"));
      const nextRank = escapeHtml(formatProgressText(data.next_rank));
      const rankClass = getRankClass(data.rank);
      const nextProgress = calculateRankProgress(data.rank, data.next_rank);
      const totalTop10Value = getFirstValue(data.to_top10, data.total_to_top10, data.total_top10, data.rank_total);
      const weeklyTop10Value = getFirstValue(data.weekly_to_top10, data.to_weekly_top10, data.weekly_top10, data.weekly_status, data.rank_weekly);
      const weeklyPoints = getFirstValue(data.weekly_points, data.weekly_pt, data.points_weekly, data.points);
      const totalTop10Section = buildRankingSection({
        rawValue: totalTop10Value,
        points: data.points,
        title: "総合ランキング",
        type: "total",
      });
      const weeklyTop10Section = buildRankingSection({
        rawValue: weeklyTop10Value,
        points: weeklyPoints,
        title: "週間ランキング",
        type: "weekly",
      });

      resultEl.innerHTML = `
        <article class="member-card" aria-label="検索結果">
          <div class="card-topline">
            <div class="card-label">Member Status</div>
            <div class="card-badge">CCL Community</div>
          </div>

          <div class="card-grid">
            <div class="info-box">
              <span class="mini">メンバーID</span>
              <div class="value">${memberId}</div>
            </div>
            <div class="info-box">
              <span class="mini">名前</span>
              <div class="value">${name}</div>
            </div>
            <div class="info-box">
              <span class="mini">プラン</span>
              <div class="value">${plan}</div>
            </div>
          </div>

          <div class="spotlight-wrap">
            <section class="spotlight spotlight-rank">
              <div class="spotlight-title">現在のランク</div>
              <div class="spotlight-main">
                <div class="rank-chip ${rankClass}">${rank}</div>
              </div>
            </section>

            <section class="spotlight">
              <div class="spotlight-title">獲得ポイント</div>
              <div class="spotlight-main">
                <div class="spotlight-value">${points.replace(/pt$/i, "")}</div>
                <div class="spotlight-sub">pt</div>
              </div>
            </section>
          </div>

          <div class="progress-section">
            <section class="progress-card">
              <div class="progress-title">
                <span>次ランクまで</span>
                <span>${nextRank}</span>
              </div>
              <div class="progress-note">
                次のランク到達に必要な残りポイントです。
              </div>
              <div class="progress-bar" aria-hidden="true">
                <div class="progress-fill" style="width: ${nextProgress}%;"></div>
              </div>
            </section>

          </div>

          <div class="ranking-dual-section">
            ${totalTop10Section}
            ${weeklyTop10Section}
          </div>
        </article>
      `;
    }

    async function searchMember() {
      const query = inputEl.value.trim();

      if (!query) {
        showStatus("error", "メンバーID または Discord表示名を入力してください。");
        renderEmpty("入力待機中", "検索するにはメンバーIDまたはDiscord表示名の入力が必要です。");
        return;
      }

      buttonEl.disabled = true;
      showStatus("loading", "検索中です...");
      renderEmpty("検索中", "該当するメンバー情報を確認しています。");

      try {
        const response = await fetch(`${API_URL}?q=${encodeURIComponent(query)}&name_match=partial`, {
          method: "GET",
          cache: "no-store",
        });

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const data = await response.json();

        if (!data.found) {
          showStatus("error", "一致するメンバーが見つかりませんでした。");
          renderEmpty(
            "見つかりませんでした",
            "入力したメンバーIDまたはDiscord表示名をもう一度確認してください。"
          );
          return;
        }

        showStatus("success", "メンバー情報を表示しました。");
        renderMemberCard(data);
      } catch (error) {
        console.error(error);
        showStatus("error", "データの取得に失敗しました。時間を置いて再度お試しください。");
        renderEmpty(
          "通信エラー",
          "検索情報を取得できませんでした。接続状況を確認して再度お試しください。"
        );
      } finally {
        buttonEl.disabled = false;
      }
    }

    buttonEl.addEventListener("click", searchMember);

    inputEl.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        event.preventDefault();
        searchMember();
      }
    });
  </script>
</body>
</html>
