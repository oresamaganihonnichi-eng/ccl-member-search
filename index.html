<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CCLメンバー情報 検索サイト</title>
  <meta
    name="description"
    content="CCL Community メンバー専用の検索サイト。メンバーIDまたはDiscord表示名で、現在のランクや獲得ポイントを確認できます。"
  />
  <style>
    :root {
      --bg-1: #020617;
      --bg-2: #071128;
      --bg-3: #0b1733;
      --panel: rgba(10, 19, 42, 0.72);
      --panel-strong: rgba(9, 18, 39, 0.92);
      --line: rgba(122, 162, 255, 0.22);
      --line-strong: rgba(122, 162, 255, 0.42);
      --text-main: #f8fbff;
      --text-sub: #9fb0d1;
      --text-soft: #6f82a8;
      --accent: #5ea2ff;
      --accent-2: #7dd3fc;
      --accent-deep: #285dff;
      --success: #7cf7c4;
      --danger: #ff8b8b;
      --shadow: 0 25px 60px rgba(0, 0, 0, 0.45);
      --glow: 0 0 0 1px rgba(122, 162, 255, 0.15),
              0 0 24px rgba(94, 162, 255, 0.12),
              0 12px 36px rgba(4, 10, 24, 0.55);
      --radius-xl: 28px;
      --radius-lg: 22px;
      --radius-md: 16px;
      --radius-sm: 12px;
      --transition: 0.28s ease;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family:
        "Inter",
        "Hiragino Sans",
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        "Meiryo",
        sans-serif;
      color: var(--text-main);
      background:
        radial-gradient(circle at 20% 15%, rgba(68, 126, 255, 0.18), transparent 26%),
        radial-gradient(circle at 80% 0%, rgba(88, 155, 255, 0.18), transparent 24%),
        radial-gradient(circle at 50% 100%, rgba(41, 89, 184, 0.22), transparent 32%),
        linear-gradient(180deg, var(--bg-3) 0%, var(--bg-2) 30%, var(--bg-1) 100%);
      overflow-x: hidden;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: auto;
      pointer-events: none;
      z-index: 0;
      filter: blur(10px);
    }

    body::before {
      width: 42vw;
      height: 42vw;
      top: -12vw;
      left: -10vw;
      background: radial-gradient(circle, rgba(70, 130, 255, 0.18), transparent 68%);
      animation: floatGlow 14s ease-in-out infinite;
    }

    body::after {
      width: 36vw;
      height: 36vw;
      right: -8vw;
      bottom: -12vw;
      background: radial-gradient(circle, rgba(78, 205, 255, 0.12), transparent 70%);
      animation: floatGlow 16s ease-in-out infinite reverse;
    }

    @keyframes floatGlow {
      0%, 100% {
        transform: translate3d(0, 0, 0) scale(1);
      }
      50% {
        transform: translate3d(0, 18px, 0) scale(1.04);
      }
    }

    .shell {
      position: relative;
      z-index: 1;
      width: min(100%, 880px);
      margin: 0 auto;
      padding: 28px 18px 56px;
    }

    .hero {
      position: relative;
      overflow: hidden;
      border: 1px solid var(--line);
      background:
        linear-gradient(180deg, rgba(15, 31, 69, 0.82), rgba(7, 15, 35, 0.92)),
        linear-gradient(135deg, rgba(94, 162, 255, 0.06), rgba(125, 211, 252, 0.03));
      border-radius: 30px;
      padding: 28px 22px 24px;
      box-shadow: var(--shadow);
      isolation: isolate;
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(120deg, transparent 0%, rgba(255,255,255,0.04) 18%, transparent 34%),
        radial-gradient(circle at 100% 0%, rgba(94, 162, 255, 0.14), transparent 28%);
      opacity: 0.95;
      pointer-events: none;
    }

    .hero::after {
      content: "";
      position: absolute;
      top: -40%;
      right: -8%;
      width: 220px;
      height: 220px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(94, 162, 255, 0.18), transparent 68%);
      pointer-events: none;
    }

    .eyebrow {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      padding: 8px 14px;
      border: 1px solid rgba(122, 162, 255, 0.24);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.03);
      color: #d6e7ff;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      backdrop-filter: blur(10px);
    }

    .eyebrow-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: linear-gradient(180deg, #8fd7ff, #4f90ff);
      box-shadow: 0 0 12px rgba(94, 162, 255, 0.8);
      flex-shrink: 0;
    }

    .hero h1 {
      position: relative;
      margin: 0;
      font-size: clamp(28px, 6vw, 48px);
      line-height: 1.08;
      font-weight: 800;
      letter-spacing: -0.04em;
      text-wrap: balance;
    }

    .hero p {
      position: relative;
      margin: 14px 0 0;
      max-width: 620px;
      color: var(--text-sub);
      font-size: clamp(14px, 2.8vw, 16px);
      line-height: 1.8;
    }

    .search-panel {
      margin-top: 20px;
      position: relative;
      border: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(10, 20, 43, 0.78), rgba(7, 14, 32, 0.88));
      border-radius: 26px;
      padding: 18px;
      box-shadow: var(--glow);
      backdrop-filter: blur(14px);
    }

    .search-label {
      display: block;
      margin-bottom: 12px;
      color: #d4e5ff;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.08em;
    }

    .search-row {
      display: flex;
      gap: 12px;
      align-items: stretch;
      flex-direction: column;
    }

    .input-wrap {
      position: relative;
      flex: 1;
    }

    .input-wrap::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 18px;
      padding: 1px;
      background: linear-gradient(135deg, rgba(125, 211, 252, 0.22), rgba(94, 162, 255, 0.1));
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
      opacity: 0.95;
    }

    .search-input {
      width: 100%;
      min-height: 58px;
      padding: 0 18px 0 48px;
      border: 1px solid rgba(255,255,255,0.04);
      border-radius: 18px;
      outline: none;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.02)),
        rgba(4, 10, 24, 0.9);
      color: var(--text-main);
      font-size: 16px;
      font-weight: 600;
      transition: border-color var(--transition), box-shadow var(--transition), transform var(--transition);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.04);
    }

    .search-input::placeholder {
      color: #7f93ba;
      font-weight: 500;
    }

    .search-input:focus {
      border-color: rgba(94, 162, 255, 0.32);
      box-shadow:
        0 0 0 4px rgba(94, 162, 255, 0.1),
        0 0 24px rgba(94, 162, 255, 0.12);
      transform: translateY(-1px);
    }

    .search-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      color: #9fc6ff;
      opacity: 0.92;
      pointer-events: none;
    }

    .search-button {
      position: relative;
      min-height: 58px;
      border: none;
      border-radius: 18px;
      padding: 0 22px;
      background:
        linear-gradient(180deg, rgba(102, 173, 255, 0.95), rgba(47, 102, 255, 0.96));
      color: white;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.04em;
      cursor: pointer;
      transition: transform var(--transition), box-shadow var(--transition), filter var(--transition);
      box-shadow:
        0 12px 24px rgba(16, 62, 166, 0.32),
        inset 0 1px 0 rgba(255,255,255,0.24);
      overflow: hidden;
      isolation: isolate;
    }

    .search-button::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(120deg, transparent 0%, rgba(255,255,255,0.18) 22%, transparent 46%);
      transform: translateX(-110%);
      transition: transform 0.7s ease;
      z-index: -1;
    }

    .search-button:hover {
      transform: translateY(-2px);
      box-shadow:
        0 18px 30px rgba(16, 62, 166, 0.38),
        inset 0 1px 0 rgba(255,255,255,0.25);
      filter: saturate(1.05);
    }

    .search-button:hover::before {
      transform: translateX(120%);
    }

    .search-button:active {
      transform: translateY(0);
    }

    .search-button:disabled {
      cursor: not-allowed;
      opacity: 0.72;
      transform: none;
      box-shadow:
        0 8px 18px rgba(16, 62, 166, 0.18),
        inset 0 1px 0 rgba(255,255,255,0.15);
    }

    .hint {
      margin-top: 12px;
      color: var(--text-soft);
      font-size: 12px;
      line-height: 1.7;
    }

    .status {
      display: none;
      align-items: center;
      gap: 10px;
      margin-top: 16px;
      padding: 14px 16px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.06);
      background: rgba(255,255,255,0.03);
      color: var(--text-sub);
      font-size: 14px;
      font-weight: 600;
    }

    .status.show {
      display: flex;
    }

    .status.loading {
      border-color: rgba(94, 162, 255, 0.18);
      background: rgba(46, 99, 255, 0.07);
      color: #d7e8ff;
    }

    .status.error {
      border-color: rgba(255, 139, 139, 0.18);
      background: rgba(255, 93, 93, 0.08);
      color: #ffd1d1;
    }

    .status.success {
      border-color: rgba(124, 247, 196, 0.18);
      background: rgba(74, 205, 145, 0.08);
      color: #d6ffef;
    }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.18);
      border-top-color: #cde7ff;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
      flex-shrink: 0;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .result-wrap {
      margin-top: 22px;
      min-height: 120px;
    }

    .member-card {
      position: relative;
      overflow: hidden;
      border-radius: 30px;
      border: 1px solid rgba(122, 162, 255, 0.18);
      background:
        linear-gradient(180deg, rgba(15, 28, 60, 0.82), rgba(7, 15, 35, 0.95)),
        linear-gradient(145deg, rgba(94, 162, 255, 0.06), rgba(125, 211, 252, 0.02));
      box-shadow:
        0 24px 54px rgba(0, 0, 0, 0.42),
        0 0 0 1px rgba(122, 162, 255, 0.08);
      backdrop-filter: blur(14px);
      padding: 22px 18px 18px;
      transform: translateY(10px);
      opacity: 0;
      animation: fadeUp 0.45s ease forwards;
    }

    @keyframes fadeUp {
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .member-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 100% 0%, rgba(94, 162, 255, 0.16), transparent 28%),
        linear-gradient(120deg, transparent 0%, rgba(255,255,255,0.035) 18%, transparent 34%);
      pointer-events: none;
    }

    .card-topline {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }

    .card-label {
      color: #d5e7ff;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      opacity: 0.88;
    }

    .card-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      color: #dcecff;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }

    .card-grid {
      display: grid;
      gap: 12px;
      grid-template-columns: 1fr;
      margin-bottom: 18px;
    }

    .info-box {
      border-radius: 20px;
      padding: 16px 16px 14px;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.015)),
        rgba(4, 10, 24, 0.4);
      border: 1px solid rgba(122, 162, 255, 0.12);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.03);
    }

    .info-box .mini {
      display: block;
      margin-bottom: 8px;
      color: var(--text-soft);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .info-box .value {
      color: var(--text-main);
      font-size: 17px;
      font-weight: 700;
      line-height: 1.4;
      word-break: break-word;
    }

    .spotlight-wrap {
      display: grid;
      gap: 12px;
      grid-template-columns: 1fr;
      margin-bottom: 18px;
    }

    .spotlight {
      position: relative;
      overflow: hidden;
      border-radius: 24px;
      padding: 18px 16px 16px;
      min-height: 118px;
      background:
        linear-gradient(180deg, rgba(13, 31, 72, 0.92), rgba(6, 14, 34, 0.94));
      border: 1px solid rgba(122, 162, 255, 0.2);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.04),
        0 10px 28px rgba(0,0,0,0.26);
    }

    .spotlight::after {
      content: "";
      position: absolute;
      width: 140px;
      height: 140px;
      border-radius: 50%;
      right: -40px;
      top: -54px;
      background: radial-gradient(circle, rgba(94, 162, 255, 0.18), transparent 70%);
      pointer-events: none;
    }

    .spotlight-title {
      color: #bfd7ff;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      margin-bottom: 10px;
      opacity: 0.94;
    }

    .spotlight-main {
      position: relative;
      display: flex;
      align-items: flex-end;
      gap: 10px;
      flex-wrap: wrap;
      z-index: 1;
    }

    .spotlight-value {
      font-size: clamp(28px, 7vw, 38px);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.04em;
      color: #ffffff;
      text-shadow: 0 0 24px rgba(94, 162, 255, 0.14);
    }

    .spotlight-sub {
      font-size: 14px;
      font-weight: 700;
      color: #dceaff;
      opacity: 0.92;
      padding-bottom: 3px;
    }

    .spotlight-rank {
      background:
        linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02)),
        rgba(4, 10, 24, 0.24);
    }

    .rank-chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 74px;
      min-height: 36px;
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.02em;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.06);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.08);
    }

    .rank-c {
      color: #edf2ff;
      background: linear-gradient(180deg, rgba(131, 146, 179, 0.32), rgba(87, 101, 130, 0.24));
      border-color: rgba(198, 210, 236, 0.18);
    }

    .rank-b {
      color: #e4f1ff;
      background: linear-gradient(180deg, rgba(72, 129, 255, 0.34), rgba(41, 82, 177, 0.26));
      border-color: rgba(130, 175, 255, 0.22);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.08),
        0 0 22px rgba(72, 129, 255, 0.15);
    }

    .rank-a {
      color: #f0ebff;
      background: linear-gradient(180deg, rgba(122, 91, 255, 0.34), rgba(84, 50, 179, 0.28));
      border-color: rgba(177, 152, 255, 0.24);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.08),
        0 0 24px rgba(122, 91, 255, 0.16);
    }

    .rank-top {
      color: #fff8dd;
      background: linear-gradient(180deg, rgba(255, 210, 76, 0.36), rgba(160, 115, 17, 0.28));
      border-color: rgba(255, 219, 117, 0.26);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.08),
        0 0 28px rgba(255, 198, 66, 0.18);
    }

    .progress-section {
      display: grid;
      gap: 12px;
      grid-template-columns: 1fr;
    }

    .progress-card {
      border-radius: 20px;
      padding: 16px 16px 14px;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.015)),
        rgba(4, 10, 24, 0.36);
      border: 1px solid rgba(122, 162, 255, 0.12);
    }

    .progress-title {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: baseline;
      margin-bottom: 10px;
    }

    .progress-title span:first-child {
      color: #dbe9ff;
      font-size: 14px;
      font-weight: 700;
    }

    .progress-title span:last-child {
      color: #ffffff;
      font-size: 15px;
      font-weight: 800;
    }

    .progress-note {
      color: var(--text-sub);
      font-size: 13px;
      line-height: 1.7;
    }

    .progress-bar {
      width: 100%;
      height: 10px;
      border-radius: 999px;
      background: rgba(255,255,255,0.06);
      overflow: hidden;
      margin-top: 12px;
      box-shadow: inset 0 1px 1px rgba(0,0,0,0.28);
    }

    .progress-fill {
      width: 100%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, rgba(94,162,255,0.55), rgba(125,211,252,0.95));
      box-shadow: 0 0 20px rgba(125,211,252,0.2);
      transform-origin: left center;
      animation: progressPulse 2.8s ease-in-out infinite;
    }

    @keyframes progressPulse {
      0%, 100% {
        opacity: 0.88;
      }
      50% {
        opacity: 1;
      }
    }

    .empty-card {
      display: grid;
      place-items: center;
      min-height: 180px;
      padding: 28px 20px;
      border-radius: 26px;
      border: 1px dashed rgba(122, 162, 255, 0.2);
      background:
        linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01)),
        rgba(4, 10, 24, 0.3);
      text-align: center;
      color: var(--text-sub);
    }

    .empty-card strong {
      display: block;
      margin-bottom: 8px;
      color: #e9f3ff;
      font-size: 17px;
      font-weight: 800;
    }

    .empty-card p {
      margin: 0;
      font-size: 14px;
      line-height: 1.8;
    }

    .footer-note {
      margin-top: 18px;
      text-align: center;
      color: var(--text-soft);
      font-size: 12px;
      line-height: 1.8;
    }

    @media (min-width: 640px) {
      .shell {
        padding: 42px 24px 72px;
      }

      .hero {
        padding: 34px 30px 28px;
      }

      .search-panel {
        padding: 22px;
      }

      .search-row {
        flex-direction: row;
      }

      .search-button {
        min-width: 140px;
      }

      .card-grid {
        grid-template-columns: repeat(3, 1fr);
      }

      .spotlight-wrap {
        grid-template-columns: repeat(2, 1fr);
      }

      .progress-section {
        grid-template-columns: repeat(2, 1fr);
      }

      .member-card {
        padding: 24px 22px 22px;
      }
    }

    @media (min-width: 920px) {
      .shell {
        padding-top: 52px;
      }

      .hero {
        padding: 38px 36px 30px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation: none !important;
        transition: none !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="hero">
      <div class="eyebrow">
        <span class="eyebrow-dot"></span>
        <span>CCL Community</span>
      </div>

      <h1>CCLメンバー情報 検索サイト</h1>
      <p>
        member_id または Discord表示名を入力すると、
        現在のランク・獲得ポイント・次の目標までをすぐに確認できます。
      </p>

      <section class="search-panel" aria-label="検索エリア">
        <label class="search-label" for="searchInput">メンバーID または Discord表示名を入力</label>

        <div class="search-row">
          <div class="input-wrap">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M21 21L16.65 16.65M18 11C18 14.866 14.866 18 11 18C7.13401 18 4 14.866 4 11C4 7.13401 7.13401 4 11 4C14.866 4 18 7.13401 18 11Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <input
              id="searchInput"
              class="search-input"
              type="text"
              placeholder="例：M0020 / アンブレラ"
              autocomplete="off"
              enterkeyhint="search"
            />
          </div>

          <button id="searchButton" class="search-button" type="button">
            検索
          </button>
        </div>

        <div id="status" class="status" aria-live="polite"></div>

        <div class="hint">
          完全一致で検索されます。member_id か Discord表示名をそのまま入力してください。
        </div>
      </section>
    </section>

    <section class="result-wrap" id="result">
      <div class="empty-card">
        <div>
          <strong>検索待機中</strong>
          <p>
            上の検索バーにメンバーIDまたはDiscord表示名を入力して、
            メンバー情報を表示してください。
          </p>
        </div>
      </div>
    </section>

    <div class="footer-note">
      CCL Community Member Search
    </div>
  </main>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwaQMAluWMvf3iQNfu-YoJCrle984iNjE91Zp1JXTYKlu61-Ct8FgoIcL3AmR6GPZaS/exec";

    const inputEl = document.getElementById("searchInput");
    const buttonEl = document.getElementById("searchButton");
    const resultEl = document.getElementById("result");
    const statusEl = document.getElementById("status");

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function normalizeRank(rank) {
      const text = String(rank ?? "").trim().toUpperCase();

      if (
        text.includes("チャンピオン") ||
        text.includes("ランカー") ||
        text.includes("TOP") ||
        text.includes("S")
      ) {
        return "top";
      }
      if (text.includes("A")) return "a";
      if (text.includes("B")) return "b";
      return "c";
    }

    function getRankClass(rank) {
      const normalized = normalizeRank(rank);
      if (normalized === "top") return "rank-top";
      if (normalized === "a") return "rank-a";
      if (normalized === "b") return "rank-b";
      return "rank-c";
    }

    function formatPoint(value, suffix = "pt") {
      const text = String(value ?? "").trim();
      if (!text) return `0${suffix}`;
      return /pt$/i.test(text) ? text : `${text}${suffix}`;
    }

    function formatProgressText(value) {
      const text = String(value ?? "").trim();
      if (!text) return "あと0pt";
      return text.includes("あと") || /pt$/i.test(text) ? text : `あと${text}pt`;
    }

    function showStatus(type, message) {
      if (!message) {
        statusEl.className = "status";
        statusEl.innerHTML = "";
        return;
      }

      const icon = type === "loading"
        ? `<span class="spinner" aria-hidden="true"></span>`
        : "";

      statusEl.className = `status show ${type}`;
      statusEl.innerHTML = `${icon}<span>${escapeHtml(message)}</span>`;
    }

    function renderEmpty(title, message) {
      resultEl.innerHTML = `
        <div class="empty-card">
          <div>
            <strong>${escapeHtml(title)}</strong>
            <p>${escapeHtml(message)}</p>
          </div>
        </div>
      `;
    }

    function renderMemberCard(data) {
      const memberId = escapeHtml(data.member_id);
      const name = escapeHtml(data.discord_name);
      const plan = escapeHtml(data.plan);
      const rank = escapeHtml(data.rank);
      const points = escapeHtml(formatPoint(data.points, "pt"));
      const nextRank = escapeHtml(formatProgressText(data.next_rank));
      const top10 = escapeHtml(formatProgressText(data.to_top10));
      const rankClass = getRankClass(data.rank);

      resultEl.innerHTML = `
        <article class="member-card" aria-label="検索結果">
          <div class="card-topline">
            <div class="card-label">Member Status</div>
            <div class="card-badge">CCL Community</div>
          </div>

          <div class="card-grid">
            <div class="info-box">
              <span class="mini">メンバーID</span>
              <div class="value">${memberId}</div>
            </div>
            <div class="info-box">
              <span class="mini">名前</span>
              <div class="value">${name}</div>
            </div>
            <div class="info-box">
              <span class="mini">プラン</span>
              <div class="value">${plan}</div>
            </div>
          </div>

          <div class="spotlight-wrap">
            <section class="spotlight spotlight-rank">
              <div class="spotlight-title">現在のランク</div>
              <div class="spotlight-main">
                <div class="rank-chip ${rankClass}">${rank}</div>
              </div>
            </section>

            <section class="spotlight">
              <div class="spotlight-title">獲得ポイント</div>
              <div class="spotlight-main">
                <div class="spotlight-value">${points.replace(/pt$/i, "")}</div>
                <div class="spotlight-sub">pt</div>
              </div>
            </section>
          </div>

          <div class="progress-section">
            <section class="progress-card">
              <div class="progress-title">
                <span>次ランクまで</span>
                <span>${nextRank}</span>
              </div>
              <div class="progress-note">
                次のランク到達に必要な残りポイントです。
              </div>
              <div class="progress-bar" aria-hidden="true">
                <div class="progress-fill"></div>
              </div>
            </section>

            <section class="progress-card">
              <div class="progress-title">
                <span>TOP10まで</span>
                <span>${top10}</span>
              </div>
              <div class="progress-note">
                TOP10入りまでの現在の差を表示しています。
              </div>
              <div class="progress-bar" aria-hidden="true">
                <div class="progress-fill"></div>
              </div>
            </section>
          </div>
        </article>
      `;
    }

    async function searchMember() {
      const query = inputEl.value.trim();

      if (!query) {
        showStatus("error", "メンバーID または Discord表示名を入力してください。");
        renderEmpty("入力待機中", "検索するにはメンバーIDまたはDiscord表示名の入力が必要です。");
        return;
      }

      buttonEl.disabled = true;
      showStatus("loading", "検索中です...");
      renderEmpty("検索中", "該当するメンバー情報を確認しています。");

      try {
        const response = await fetch(`${API_URL}?q=${encodeURIComponent(query)}`, {
          method: "GET",
          cache: "no-store",
        });

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const data = await response.json();

        if (!data.found) {
          showStatus("error", "一致するメンバーが見つかりませんでした。");
          renderEmpty(
            "見つかりませんでした",
            "入力したメンバーIDまたはDiscord表示名をもう一度確認してください。"
          );
          return;
        }

        showStatus("success", "メンバー情報を表示しました。");
        renderMemberCard(data);
      } catch (error) {
        console.error(error);
        showStatus("error", "データの取得に失敗しました。時間を置いて再度お試しください。");
        renderEmpty(
          "通信エラー",
          "検索情報を取得できませんでした。接続状況を確認して再度お試しください。"
        );
      } finally {
        buttonEl.disabled = false;
      }
    }

    buttonEl.addEventListener("click", searchMember);

    inputEl.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        event.preventDefault();
        searchMember();
      }
    });
  </script>
</body>
</html>
